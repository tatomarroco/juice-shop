name: OWASP Security Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  sast_bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Crear carpeta de reportes Bandit
        run: mkdir -p reports/bandit

      - name: Ejecutar Bandit
        run: |
          bandit -r . -f txt -o reports/bandit/bandit-report.txt || true

      - name: Ver archivos generados por Bandit
        if: always()
        run: |
          echo "Contenido de reports:"
          ls -R reports || true

      - name: Subir reporte Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit
          if-no-files-found: error

  dependency_check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear carpeta de reportes Dependency-Check
        run: mkdir -p reports/dependency-check

      - name: Ejecutar Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'mi-proyecto'
          path: '.'
          format: 'HTML'
          out: 'reports/dependency-check'

      - name: Ver archivos generados por Dependency-Check
        if: always()
        run: |
          echo "Contenido de reports:"
          ls -R reports || true

      - name: Subir reporte Dependency-Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check
          if-no-files-found: error

  zap_baseline:
    name: DAST - OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs:
      - sast_bandit
      - dependency_check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ejecutar ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://tusitio.com'
          fail_action: false
          cmd_options: '-a -r report_html.html -w report_md.md -J report_json.json'

      - name: Ver archivos generados por ZAP
        if: always()
        run: |
          echo "PWD:"
          pwd
          echo "Contenido actual:"
          ls -la
          echo "Buscar reportes:"
          find . -maxdepth 3 -type f | sort | grep -Ei 'report|zap' || true

      - name: Subir reporte ZAP HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-html-report
          path: report_html.html
          if-no-files-found: error

      - name: Subir reporte ZAP Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-md-report
          path: report_md.md
          if-no-files-found: error

      - name: Subir reporte ZAP JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-json-report
          path: report_json.json
          if-no-files-found: error
